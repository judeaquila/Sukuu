{% extends "base.html" %}
{% block title %}Edit profile — Sukuu{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <h1 class="text-2xl font-extrabold">Creator profile</h1>
  <p class="mt-1 text-sm text-gray-500">Shown publicly on your school page.</p>
  <form method="post" enctype="multipart/form-data" class="mt-6 space-y-4 rounded-3xl border border-gray-100 bg-white p-8 shadow-sm">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-semibold">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button class="rounded-xl bg-brand px-6 py-3 font-semibold text-white hover:bg-brand-dark">Save profile</button>
  </form>
</div>
{% endblock %}
